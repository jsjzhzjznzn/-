// 语法版本：proto3
syntax = "proto3";

// 包名：客户端与服务端共享的消息体定义层
// 与 LoginPacket.proto 同属 common.network，消息名不冲突即可共存
package common.network;

// 生成的 C# 命名空间（protoc 生成 ChatPacket.cs 中类的归属）
option csharp_namespace = "Common.Network";

/// <summary>
/// 聊天消息条目
/// </summary>
message ChatMessageItem {
  /// <summary>
  /// 消息ID
  /// 类型：string
  /// 用途：MongoDB _id（ObjectId 的 24 位十六进制字符串）
  /// 说明：ObjectId 是 12 字节，塞不进 int64，因此用 string
  /// </summary>
  string message_id = 1;

  /// <summary>
  /// 发送者玩家ID
  /// 类型：int32
  /// 用途：accounts.Id，用于客户端判断气泡靠左还是靠右
  /// </summary>
  int32 sender_id = 2;

  /// <summary>
  /// 接收者玩家ID
  /// 类型：int32
  /// 用途：accounts.Id
  /// </summary>
  int32 receiver_id = 3;

  /// <summary>
  /// 消息内容
  /// 类型：string
  /// 用途：文本消息正文
  /// </summary>
  string content = 4;

  /// <summary>
  /// 发送时间
  /// 类型：int64
  /// 用途：服务端 UTC 毫秒时间戳（客户端时钟不可信，一律以服务端为准）
  /// </summary>
  int64 sent_at_ms = 5;

  /// <summary>
  /// 是否已读
  /// 类型：bool
  /// 用途：接收方是否已读该条消息
  /// </summary>
  bool read = 6;

  /// <summary>
  /// 消息内容类型
  /// 类型：int32
  /// 用途：0=文本（默认值，历史消息没有该字段时反序列化即 0，天然向后兼容）；1=表情包
  /// 说明：为 1 时 content 存放的是贴纸键（客户端 Resources/biaoq 下的资源名），不是正文；
  ///       客户端认不出该键时降级显示占位文案，界面不会空掉
  /// </summary>
  int32 content_type = 7;

  /// <summary>
  /// 发送者昵称
  /// 类型：string
  /// 用途：世界频道每行要显示"谁说的"，由服务端按 sender_id 查账号表补齐
  /// 说明：私聊为空——私聊界面用好友列表里的备注渲染，不需要重复下发
  /// </summary>
  string sender_name = 8;
}

/// <summary>
/// 发送聊天消息请求数据类
/// 刻意不包含 sender_id / conversation_id：
/// 发送者身份由服务端会话（session.PlayerId）推导，客户端无法伪造，这是聊天隐私的结构性保证
/// </summary>
message ChatSendRequest {
  /// <summary>
  /// 目标好友玩家ID
  /// 类型：int32
  /// 用途：消息发给谁（accounts.Id）
  /// </summary>
  int32 target_id = 1;

  /// <summary>
  /// 消息内容
  /// 类型：string
  /// 用途：要发送的文本正文（content_type=0）或贴纸键（content_type=1）
  /// </summary>
  string content = 2;

  /// <summary>
  /// 消息内容类型
  /// 类型：int32
  /// 用途：0=文本（默认值，不传即文本）；1=表情包（content 传贴纸键，服务端按表情的长度上限校验）
  /// </summary>
  int32 content_type = 3;
}

/// <summary>
/// 发送聊天消息响应数据类
/// </summary>
message ChatSendResponse {
  /// <summary>
  /// 是否发送成功
  /// 类型：bool
  /// 用途：true表示已落库
  /// </summary>
  bool success = 1;

  /// <summary>
  /// 提示信息
  /// 类型：string
  /// 用途：失败原因（非好友/内容为空等）或成功提示
  /// </summary>
  string message = 2;

  /// <summary>
  /// 消息回显
  /// 类型：ChatMessageItem
  /// 用途：落库后的消息（含服务端生成的ID与时间戳），客户端用它校准本地乐观UI
  /// 失败时为空
  /// </summary>
  ChatMessageItem echo = 3;
}

/// <summary>
/// 聊天历史请求数据类
/// 同样不含 player_id / conversation_id，只带对方ID，己方身份由会话推导
/// </summary>
message ChatHistoryRequest {
  /// <summary>
  /// 目标好友玩家ID
  /// 类型：int32
  /// 用途：要拉取与谁的历史消息（accounts.Id）
  /// </summary>
  int32 target_id = 1;

  /// <summary>
  /// 翻页游标
  /// 类型：int64
  /// 用途：只取该 UTC 毫秒时间戳之前的消息；0 表示从最新开始（首次打开会话）
  /// </summary>
  int64 before_ms = 2;

  /// <summary>
  /// 本次拉取条数
  /// 类型：int32
  /// 用途：0 表示使用服务端默认值（50），超过服务端上限会被截断
  /// </summary>
  int32 limit = 3;

  /// <summary>
  /// 预读模式
  /// 类型：bool
  /// 用途：true = 只读不写，不把对方发我的消息置为已读（登录后的消息预热用）；
  ///       false（默认值）= 保持原有"拉历史即已读"语义，老客户端不传该字段行为完全不变
  /// </summary>
  bool peek = 4;
}

/// <summary>
/// 聊天历史响应数据类
/// </summary>
message ChatHistoryResponse {
  /// <summary>
  /// 本次返回条数
  /// 类型：int32
  /// 用途：条目数量
  /// </summary>
  int32 count = 1;

  /// <summary>
  /// 历史消息列表
  /// 类型：repeated ChatMessageItem
  /// 用途：按时间正序（旧→新）排列，可直接从上到下渲染
  /// </summary>
  repeated ChatMessageItem messages = 2;

  /// <summary>
  /// 回传目标好友ID
  /// 类型：int32
  /// 用途：便于客户端核对返回的是哪个会话，避免异步错位
  /// </summary>
  int32 target_id = 3;
}

/// <summary>
/// 聊天消息推送数据类（服务端 → 接收方）
/// 注意：这是服务端主动推送，没有对应的 Request 消息
/// </summary>
message ChatReceiveNotify {
  /// <summary>
  /// 新到达的消息
  /// 类型：ChatMessageItem
  /// 用途：接收方在线时收到并追加到会话
  /// </summary>
  ChatMessageItem message = 1;
}

// ────────────────────────── 世界频道 ──────────────────────────
// 世界频道=全体在线玩家共享的公共频道，与私聊的三层隐私模型不同：
// 无 target_id（发送者身份仍由会话推导，客户端不可伪造）、无好友准入，
// 落库后由服务端广播给全部在线会话；不在线的玩家上线后拉历史即可补齐

/// <summary>
/// 世界频道发送请求
/// 刻意不包含 sender_id：发送者身份由服务端会话（session.PlayerId）推导
/// </summary>
message WorldChatSendRequest {
  /// <summary>
  /// 消息内容
  /// 类型：string
  /// 用途：要发送到世界频道的文本正文
  /// </summary>
  string content = 1;

  /// <summary>
  /// 消息内容类型
  /// 类型：int32
  /// 用途：0=文本（默认值，不传即文本）；1=表情包（content 传贴纸键）
  /// </summary>
  int32 content_type = 2;
}

/// <summary>
/// 世界频道发送响应数据类
/// </summary>
message WorldChatSendResponse {
  /// <summary>
  /// 是否发送成功
  /// 类型：bool
  /// 用途：true 表示已落库并已广播
  /// </summary>
  bool success = 1;

  /// <summary>
  /// 提示信息
  /// 类型：string
  /// 用途：失败原因（未登录/内容为空/冷却中/服务不可用等）或成功提示
  /// </summary>
  string message = 2;

  /// <summary>
  /// 消息回显
  /// 类型：ChatMessageItem
  /// 用途：落库后的消息（含服务端生成的ID、时间戳与发送者昵称），客户端用它校准本地乐观 UI
  /// 失败时为空
  /// </summary>
  ChatMessageItem echo = 3;
}

/// <summary>
/// 世界频道历史请求数据类
/// 只带翻页游标，不需要任何身份参数（身份由会话推导）
/// </summary>
message WorldChatHistoryRequest {
  /// <summary>
  /// 翻页游标
  /// 类型：int64
  /// 用途：只取该 UTC 毫秒时间戳之前的消息；0 表示从最新开始（首次打开面板）
  /// </summary>
  int64 before_ms = 1;

  /// <summary>
  /// 本次拉取条数
  /// 类型：int32
  /// 用途：0 表示使用服务端默认值，超过服务端上限会被截断
  /// </summary>
  int32 limit = 2;
}

/// <summary>
/// 世界频道历史响应数据类
/// </summary>
message WorldChatHistoryResponse {
  /// <summary>
  /// 本次返回条数
  /// 类型：int32
  /// 用途：条目数量
  /// </summary>
  int32 count = 1;

  /// <summary>
  /// 历史消息列表
  /// 类型：repeated ChatMessageItem
  /// 用途：按时间正序（旧→新）排列，可直接从上到下渲染
  /// </summary>
  repeated ChatMessageItem messages = 2;
}

/// <summary>
/// 世界频道消息推送数据类（服务端 → 全部在线会话）
/// 注意：这是服务端主动广播，没有对应的 Request 消息
/// </summary>
message WorldChatNotify {
  /// <summary>
  /// 新到达的世界频道消息
  /// 类型：ChatMessageItem
  /// 用途：在线玩家收到后追加到世界频道列表
  /// </summary>
  ChatMessageItem message = 1;
}
