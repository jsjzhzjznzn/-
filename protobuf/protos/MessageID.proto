// 语法版本：proto3
syntax = "proto3";

// 包名：客户端与服务端共享的消息ID定义层
// 注意：消息ID与消息体分属不同 package，
// 避免枚举值 LoginRequest/LoginResponse 与同名消息类型冲突（protobuf 的 C++ 作用域规则）
package common.messageid;

// 生成的 C# 命名空间（protoc 生成 MessageID.cs 中枚举的归属）
option csharp_namespace = "Common.Enum";

/// <summary>
/// 网络消息ID枚举
/// 用于标识客户端与服务器之间通信的消息类型
/// </summary>
enum MessageID {
  // ────────────────────────── 未知 ──────────────────────────
  /// <summary>
  /// 未知消息
  /// 类型：MessageID (枚举)
  /// 用途：占位值，proto3 要求枚举首值必须为 0，不应在网络中发送
  /// 值：0
  /// </summary>
  Unknown = 0;

  // ────────────────────────── 登录 ──────────────────────────
  /// <summary>
  /// 登录请求
  /// 类型：MessageID (枚举)
  /// 用途：客户端向服务器发送登录请求，携带账号密码
  /// 对应数据结构：LoginRequest
  /// 值：1001
  /// </summary>
  LoginRequest = 1001;

  /// <summary>
  /// 登录响应
  /// 类型：MessageID (枚举)
  /// 用途：服务器向客户端返回登录结果，包含玩家基本信息
  /// 对应数据结构：LoginResponse
  /// 值：1002
  /// </summary>
  LoginResponse = 1002;

  /// <summary>
  /// 自动登录请求
  /// 类型：MessageID (枚举)
  /// 用途：客户端用保存的自动登录令牌免密码换会话，携带账号与令牌
  /// 对应数据结构：TokenLoginRequest
  /// 值：1003
  /// </summary>
  TokenLoginRequest = 1003;

  /// <summary>
  /// 自动登录响应
  /// 类型：MessageID (枚举)
  /// 用途：服务器返回自动登录结果（复用 LoginResponse 消息体，成功时滑动续期下发新过期时间）
  /// 对应数据结构：LoginResponse
  /// 值：1004
  /// </summary>
  TokenLoginResponse = 1004;

  /// <summary>
  /// 被顶下线推送
  /// 类型：MessageID (枚举)
  /// 用途：同一账号在别处登录成功时，服务端主动向旧会话推送"账号在其它设备登录"，随后关闭其连接（占登录段段尾，属服务端主动推送）
  /// 对应数据结构：KickoutNotify
  /// 值：1005
  /// </summary>
  KickoutNotify = 1005;

  // ────────────────────────── 注册 ──────────────────────────
  /// <summary>
  /// 注册请求
  /// 类型：MessageID (枚举)
  /// 用途：客户端向服务器发送注册请求，携带账号密码
  /// 对应数据结构：RegisterRequest
  /// 值：2001
  /// </summary>
  RegisterRequest = 2001;

  /// <summary>
  /// 注册响应
  /// 类型：MessageID (枚举)
  /// 用途：服务器向客户端返回注册结果
  /// 对应数据结构：RegisterResponse
  /// 值：2002
  /// </summary>
  RegisterResponse = 2002;

  // ────────────────────────── 好友 ──────────────────────────
  /// <summary>
  /// 好友列表请求
  /// 类型：MessageID (枚举)
  /// 用途：客户端请求查询自己的好友列表（消息体为空，身份由会话绑定）
  /// 对应数据结构：（空）
  /// 值：2103
  /// </summary>
  FriendListRequest = 2103;

  /// <summary>
  /// 好友列表响应
  /// 类型：MessageID (枚举)
  /// 用途：服务器返回好友数量与好友列表
  /// 对应数据结构：FriendListResponse
  /// 值：2104
  /// </summary>
  FriendListResponse = 2104;

  /// <summary>
  /// 查询玩家请求
  /// 类型：MessageID (枚举)
  /// 用途：按玩家ID查询账号信息（添加朋友前先查询确认对方存在）
  /// 对应数据结构：QueryPlayerRequest
  /// 值：2105
  /// </summary>
  QueryPlayerRequest = 2105;

  /// <summary>
  /// 查询玩家响应
  /// 类型：MessageID (枚举)
  /// 用途：返回查询到的玩家信息（或未找到）
  /// 对应数据结构：QueryPlayerResponse
  /// 值：2106
  /// </summary>
  QueryPlayerResponse = 2106;

  /// <summary>
  /// 好友申请请求
  /// 类型：MessageID (枚举)
  /// 用途：向目标玩家发送好友申请（写入 friendships 表，Status=0 待同意）
  /// 对应数据结构：FriendAddRequest
  /// 值：2107
  /// </summary>
  FriendAddRequest = 2107;

  /// <summary>
  /// 好友申请响应
  /// 类型：MessageID (枚举)
  /// 用途：返回申请发送结果
  /// 对应数据结构：FriendAddResponse
  /// 值：2108
  /// </summary>
  FriendAddResponse = 2108;

  /// <summary>
  /// 好友申请回应请求
  /// 类型：MessageID (枚举)
  /// 用途：对收到的好友申请做出回应（同意/拒绝）
  /// 对应数据结构：FriendRespondRequest
  /// 值：2109
  /// </summary>
  FriendRespondRequest = 2109;

  /// <summary>
  /// 好友申请回应响应
  /// 类型：MessageID (枚举)
  /// 用途：返回回应处理结果
  /// 对应数据结构：FriendRespondResponse
  /// 值：2110
  /// </summary>
  FriendRespondResponse = 2110;

  /// <summary>
  /// 待处理申请列表请求
  /// 类型：MessageID (枚举)
  /// 用途：查询谁申请了我（Status=0 的申请者列表）
  /// 对应数据结构：（空）
  /// 值：2111
  /// </summary>
  FriendRequestsRequest = 2111;

  /// <summary>
  /// 待处理申请列表响应
  /// 类型：MessageID (枚举)
  /// 用途：返回所有待处理申请的申请者信息
  /// 对应数据结构：FriendRequestsResponse
  /// 值：2112
  /// </summary>
  FriendRequestsResponse = 2112;

  // ────────────────────────── 聊天 ──────────────────────────
  /// <summary>
  /// 发送聊天消息请求
  /// 类型：MessageID (枚举)
  /// 用途：向好友发送一条聊天消息（只带目标ID与内容，发送者身份由服务端会话绑定）
  /// 对应数据结构：ChatSendRequest
  /// 值：2201
  /// </summary>
  ChatSendRequest = 2201;

  /// <summary>
  /// 发送聊天消息响应
  /// 类型：MessageID (枚举)
  /// 用途：返回发送结果与落库后的消息回显（含服务端ID与时间戳）
  /// 对应数据结构：ChatSendResponse
  /// 值：2202
  /// </summary>
  ChatSendResponse = 2202;

  /// <summary>
  /// 聊天历史请求
  /// 类型：MessageID (枚举)
  /// 用途：点击好友时拉取其与自己的历史消息（身份由服务端会话绑定）
  /// 对应数据结构：ChatHistoryRequest
  /// 值：2203
  /// </summary>
  ChatHistoryRequest = 2203;

  /// <summary>
  /// 聊天历史响应
  /// 类型：MessageID (枚举)
  /// 用途：返回按时间正序（旧→新）排列的历史消息列表
  /// 对应数据结构：ChatHistoryResponse
  /// 值：2204
  /// </summary>
  ChatHistoryResponse = 2204;

  /// <summary>
  /// 聊天消息推送
  /// 类型：MessageID (枚举)
  /// 用途：服务端主动推给接收方（非请求的响应），接收方在线才发送
  /// 对应数据结构：ChatReceiveNotify
  /// 值：2205
  /// </summary>
  ChatReceiveNotify = 2205;

  /// <summary>
  /// 世界频道发送请求
  /// 类型：MessageID (枚举)
  /// 用途：向全体在线玩家共享的世界频道发一条消息（只带内容，发送者身份由服务端会话绑定）
  /// 对应数据结构：WorldChatSendRequest
  /// 值：2206
  /// </summary>
  WorldChatSendRequest = 2206;

  /// <summary>
  /// 世界频道发送响应
  /// 类型：MessageID (枚举)
  /// 用途：返回发送结果与落库后的消息回显（含服务端ID、时间戳与发送者昵称）
  /// 对应数据结构：WorldChatSendResponse
  /// 值：2207
  /// </summary>
  WorldChatSendResponse = 2207;

  /// <summary>
  /// 世界频道历史请求
  /// 类型：MessageID (枚举)
  /// 用途：打开世界频道面板时拉取最近的公共消息（身份由服务端会话绑定）
  /// 对应数据结构：WorldChatHistoryRequest
  /// 值：2208
  /// </summary>
  WorldChatHistoryRequest = 2208;

  /// <summary>
  /// 世界频道历史响应
  /// 类型：MessageID (枚举)
  /// 用途：返回按时间正序（旧→新）排列的公共消息列表
  /// 对应数据结构：WorldChatHistoryResponse
  /// 值：2209
  /// </summary>
  WorldChatHistoryResponse = 2209;

  /// <summary>
  /// 世界频道消息广播
  /// 类型：MessageID (枚举)
  /// 用途：服务端主动广播给全部在线会话（非请求的响应）
  /// 对应数据结构：WorldChatNotify
  /// 值：2210
  /// </summary>
  WorldChatNotify = 2210;

  // ────────────────────────── 排行榜 ──────────────────────────
  /// <summary>
  /// 成绩上报请求
  /// 类型：MessageID (枚举)
  /// 用途：客户端挑战结束后上报本次成绩（服务端按"只保留最高分"入账）
  /// 对应数据结构：ScoreSubmitRequest
  /// 值：2301
  /// </summary>
  ScoreSubmitRequest = 2301;

  /// <summary>
  /// 成绩上报响应
  /// 类型：MessageID (枚举)
  /// 用途：返回入账结果、当前最高分与实时排名
  /// 对应数据结构：ScoreSubmitResponse
  /// 值：2302
  /// </summary>
  ScoreSubmitResponse = 2302;

  /// <summary>
  /// 排行榜查询请求
  /// 类型：MessageID (枚举)
  /// 用途：请求某挑战的 TopN 榜单（身份由服务端会话绑定，用于附带"我的排名"）
  /// 对应数据结构：LeaderboardRequest
  /// 值：2303
  /// </summary>
  LeaderboardRequest = 2303;

  /// <summary>
  /// 排行榜查询响应
  /// 类型：MessageID (枚举)
  /// 用途：返回 TopN 条目（名次/玩家/名字/分数）与查询者自己的排名分数
  /// 对应数据结构：LeaderboardResponse
  /// 值：2304
  /// </summary>
  LeaderboardResponse = 2304;

  // ────────────────────────── 背包 ──────────────────────────
  /// <summary>
  /// 背包列表请求
  /// 类型：MessageID (枚举)
  /// 用途：打开背包时一次拉取槽位快照与物品配置表（消息体为空，身份由会话绑定）
  /// 对应数据结构：BagListRequest
  /// 值：2401
  /// </summary>
  BagListRequest = 2401;

  /// <summary>
  /// 背包列表响应
  /// 类型：MessageID (枚举)
  /// 用途：返回背包容量、非空槽位快照与物品静态配置表
  /// 对应数据结构：BagListResponse
  /// 值：2402
  /// </summary>
  BagListResponse = 2402;

  /// <summary>
  /// 使用物品请求
  /// 类型：MessageID (枚举)
  /// 用途：按槽位使用指定数量（服务端校验归属与数量后扣减）
  /// 对应数据结构：BagUseRequest
  /// 值：2403
  /// </summary>
  BagUseRequest = 2403;

  /// <summary>
  /// 使用物品响应
  /// 类型：MessageID (枚举)
  /// 用途：返回操作后的完整槽位快照
  /// 对应数据结构：BagUseResponse
  /// 值：2404
  /// </summary>
  BagUseResponse = 2404;

  /// <summary>
  /// 丢弃物品请求
  /// 类型：MessageID (枚举)
  /// 用途：按槽位丢弃指定数量（丢光则清空该槽）
  /// 对应数据结构：BagDiscardRequest
  /// 值：2405
  /// </summary>
  BagDiscardRequest = 2405;

  /// <summary>
  /// 丢弃物品响应
  /// 类型：MessageID (枚举)
  /// 用途：返回操作后的完整槽位快照
  /// 对应数据结构：BagDiscardResponse
  /// 值：2406
  /// </summary>
  BagDiscardResponse = 2406;

  /// <summary>
  /// 整理背包请求
  /// 类型：MessageID (枚举)
  /// 用途：请求服务端执行同类合并 + 排序重排（消息体为空，身份由会话绑定）
  /// 对应数据结构：BagTidyRequest
  /// 值：2407
  /// </summary>
  BagTidyRequest = 2407;

  /// <summary>
  /// 整理背包响应
  /// 类型：MessageID (枚举)
  /// 用途：返回整理后的完整槽位快照
  /// 对应数据结构：BagTidyResponse
  /// 值：2408
  /// </summary>
  BagTidyResponse = 2408;

  /// <summary>
  /// 拖拽换位请求
  /// 类型：MessageID (枚举)
  /// 用途：交换两个槽位的内容（含与空槽交换）
  /// 对应数据结构：BagSwapRequest
  /// 值：2409
  /// </summary>
  BagSwapRequest = 2409;

  /// <summary>
  /// 拖拽换位响应
  /// 类型：MessageID (枚举)
  /// 用途：返回交换后的完整槽位快照
  /// 对应数据结构：BagSwapResponse
  /// 值：2410
  /// </summary>
  BagSwapResponse = 2410;

  /// <summary>
  /// 测试发放请求
  /// 类型：MessageID (枚举)
  /// 用途：调试用直接发放物品（本期物品唯一来源）
  /// 对应数据结构：BagGrantRequest
  /// 值：2411
  /// </summary>
  BagGrantRequest = 2411;

  /// <summary>
  /// 测试发放响应
  /// 类型：MessageID (枚举)
  /// 用途：返回发放后的完整槽位快照（满包时说明未放下的数量）
  /// 对应数据结构：BagGrantResponse
  /// 值：2412
  /// </summary>
  BagGrantResponse = 2412;

  // ────────────────────────── 任务 ──────────────────────────
  /// <summary>
  /// 任务列表请求
  /// 类型：MessageID (枚举)
  /// 用途：打开任务面板时一次拉取任务配置表与玩家任务状态（消息体为空，身份由会话绑定）
  /// 对应数据结构：QuestListRequest
  /// 值：2501
  /// </summary>
  QuestListRequest = 2501;

  /// <summary>
  /// 任务列表响应
  /// 类型：MessageID (枚举)
  /// 用途：返回任务静态配置表与玩家已接取任务的状态快照
  /// 对应数据结构：QuestListResponse
  /// 值：2502
  /// </summary>
  QuestListResponse = 2502;

  /// <summary>
  /// 接取任务请求
  /// 类型：MessageID (枚举)
  /// 用途：接取任务（服务端校验前置任务是否已提交、是否重复接取）
  /// 对应数据结构：QuestAcceptRequest
  /// 值：2503
  /// </summary>
  QuestAcceptRequest = 2503;

  /// <summary>
  /// 接取任务响应
  /// 类型：MessageID (枚举)
  /// 用途：返回操作后的任务状态快照
  /// 对应数据结构：QuestAcceptResponse
  /// 值：2504
  /// </summary>
  QuestAcceptResponse = 2504;

  /// <summary>
  /// 提交任务请求
  /// 类型：MessageID (枚举)
  /// 用途：提交已完成任务（收集类为交付语义，服务端重新校验持有量后扣除物品并发奖）
  /// 对应数据结构：QuestSubmitRequest
  /// 值：2505
  /// </summary>
  QuestSubmitRequest = 2505;

  /// <summary>
  /// 提交任务响应
  /// 类型：MessageID (枚举)
  /// 用途：返回提交结果与发放的奖励说明
  /// 对应数据结构：QuestSubmitResponse
  /// 值：2506
  /// </summary>
  QuestSubmitResponse = 2506;

  /// <summary>
  /// 放弃任务请求
  /// 类型：MessageID (枚举)
  /// 用途：放弃进行中的任务（放弃后回到未接取状态，可重新接取）
  /// 对应数据结构：QuestAbandonRequest
  /// 值：2507
  /// </summary>
  QuestAbandonRequest = 2507;

  /// <summary>
  /// 放弃任务响应
  /// 类型：MessageID (枚举)
  /// 用途：返回放弃结果与操作后的任务状态快照
  /// 对应数据结构：QuestAbandonResponse
  /// 值：2508
  /// </summary>
  QuestAbandonResponse = 2508;

  /// <summary>
  /// 调试：设置任务进度请求
  /// 类型：MessageID (枚举)
  /// 用途：GM 指令，直接改写任务进度便于联调（进度以存档缓存为准）
  /// 对应数据结构：QuestGmSetProgressRequest
  /// 值：2509
  /// </summary>
  QuestGmSetProgressRequest = 2509;

  /// <summary>
  /// 调试：设置任务进度响应
  /// 类型：MessageID (枚举)
  /// 用途：返回改写结果与操作后的任务状态快照
  /// 对应数据结构：QuestGmSetProgressResponse
  /// 值：2510
  /// </summary>
  QuestGmSetProgressResponse = 2510;

  /// <summary>
  /// 任务进度推送
  /// 类型：MessageID (枚举)
  /// 用途：玩法事件推进了任务进度时，服务端主动推给在线玩家（非请求的响应）
  /// 对应数据结构：QuestProgressNotify
  /// 值：2511
  /// </summary>
  QuestProgressNotify = 2511;

  // ────────────────────────── 邮件 ──────────────────────────

  /// <summary>
  /// 邮件列表请求
  /// 类型：MessageID (枚举)
  /// 用途：打开邮件面板时拉取全部有效邮件（未删除且未过期）
  /// 对应数据结构：MailListRequest
  /// 值：2601
  /// </summary>
  MailListRequest = 2601;

  /// <summary>
  /// 邮件列表响应
  /// 类型：MessageID (枚举)
  /// 用途：返回邮箱容量与全部有效邮件快照
  /// 对应数据结构：MailListResponse
  /// 值：2602
  /// </summary>
  MailListResponse = 2602;

  /// <summary>
  /// 标记已读请求
  /// 类型：MessageID (枚举)
  /// 用途：点开邮件详情时置已读位（服务端幂等）
  /// 对应数据结构：MailReadRequest
  /// 值：2603
  /// </summary>
  MailReadRequest = 2603;

  /// <summary>
  /// 标记已读响应
  /// 类型：MessageID (枚举)
  /// 用途：返回置读结果与操作后的邮件快照
  /// 对应数据结构：MailReadResponse
  /// 值：2604
  /// </summary>
  MailReadResponse = 2604;

  /// <summary>
  /// 领取附件请求
  /// 类型：MessageID (枚举)
  /// 用途：一键领取全部附件，服务端单事务内校验并整单发放（背包放不下则拒绝）
  /// 对应数据结构：MailClaimRequest
  /// 值：2605
  /// </summary>
  MailClaimRequest = 2605;

  /// <summary>
  /// 领取附件响应
  /// 类型：MessageID (枚举)
  /// 用途：返回领取结果与操作后的邮件快照
  /// 对应数据结构：MailClaimResponse
  /// 值：2606
  /// </summary>
  MailClaimResponse = 2606;

  /// <summary>
  /// 删除邮件请求
  /// 类型：MessageID (枚举)
  /// 用途：软删除邮件（置状态位，不物理删行）
  /// 对应数据结构：MailDeleteRequest
  /// 值：2607
  /// </summary>
  MailDeleteRequest = 2607;

  /// <summary>
  /// 删除邮件响应
  /// 类型：MessageID (枚举)
  /// 用途：返回删除结果与操作后的邮件快照
  /// 对应数据结构：MailDeleteResponse
  /// 值：2608
  /// </summary>
  MailDeleteResponse = 2608;

  /// <summary>
  /// 测试发件请求
  /// 类型：MessageID (枚举)
  /// 用途：GM/联调指令，本期邮件唯一来源（可发自己或指定玩家，附件可为空）
  /// 对应数据结构：MailGrantRequest
  /// 值：2609
  /// </summary>
  MailGrantRequest = 2609;

  /// <summary>
  /// 测试发件响应
  /// 类型：MessageID (枚举)
  /// 用途：返回发件结果（收件人在线时由推送刷新）
  /// 对应数据结构：MailGrantResponse
  /// 值：2610
  /// </summary>
  MailGrantResponse = 2610;

  /// <summary>
  /// 收到新邮件推送
  /// 类型：MessageID (枚举)
  /// 用途：GM 发件时收件人在线即推送（非请求的响应），供面板与红点实时刷新
  /// 对应数据结构：MailReceiveNotify
