  /// 用途：确认落库结果与服务端写入时间（仅排障用，客户端不依赖它推进玩法）
  /// 对应数据结构：SaveStatePushResponse
  /// 值：3304
  /// </summary>
  SaveStatePushResponse = 3304;

  // ────────────────────────── 成就 ──────────────────────────
  // 独立成就域（与任务 25xx 解耦）：玩法模块只报事实，成就服务统一判断/解锁/发奖；
  // 定义/进度/解锁/领取四层分离，领取服务端权威且幂等

  /// <summary>
  /// 成就列表请求
  /// 类型：MessageID (枚举)
  /// 用途：拉取成就静态配置、玩家成就状态与汇总（消息体为空，身份由会话绑定）
  /// 对应数据结构：AchievementListRequest
  /// 值：3401
  /// </summary>
  AchievementListRequest = 3401;

  /// <summary>
  /// 成就列表响应
  /// 类型：MessageID (枚举)
  /// 用途：返回配置、玩家状态与汇总（总数/已解锁/可领取/成就点）
  /// 对应数据结构：AchievementListResponse
  /// 值：3402
  /// </summary>
  AchievementListResponse = 3402;

  /// <summary>
  /// 领取成就奖励请求
  /// 类型：MessageID (枚举)
  /// 用途：领取已解锁待领取的成就奖励（服务端事务校验 + 幂等）
  /// 对应数据结构：AchievementClaimRequest
  /// 值：3403
  /// </summary>
  AchievementClaimRequest = 3403;

  /// <summary>
  /// 领取成就奖励响应
  /// 类型：MessageID (枚举)
  /// 用途：返回发放明细、操作后的成就快照与汇总
  /// 对应数据结构：AchievementClaimResponse
  /// 值：3404
  /// </summary>
  AchievementClaimResponse = 3404;

  /// <summary>
  /// 成就解锁推送
  /// 类型：MessageID (枚举)
  /// 用途：条件达成时服务端主动推送（在线才推，离线靠下次拉列表补齐）
  /// 对应数据结构：AchievementUnlockedNotify
  /// 值：3405
  /// </summary>
  AchievementUnlockedNotify = 3405;

  /// <summary>
  /// 成就进度推送
  /// 类型：MessageID (枚举)
  /// 用途：进度变化时推送（节流），供面板打开时刷新进度条
  /// 对应数据结构：AchievementProgressNotify
  /// 值：3406
  /// </summary>
  AchievementProgressNotify = 3406;

  /// <summary>
  /// GM/联调：改进度、强制解锁、重置
  /// 类型：MessageID (枚举)
  /// 用途：成就系统联调用，直接改写玩家成就状态
  /// 对应数据结构：AchievementGmRequest
  /// 值：3407
  /// </summary>
  AchievementGmRequest = 3407;

  /// <summary>
  /// GM/联调响应
  /// 类型：MessageID (枚举)
  /// 用途：返回改写结果与操作后的成就快照
  /// 对应数据结构：AchievementGmResponse
  /// 值：3408
  /// </summary>
  AchievementGmResponse = 3408;

  // ────────────────────────── 装备 ──────────────────────────
  // 装备域（与背包 24xx 解耦）：背包管"有哪些"，player_equipment 管"穿在哪"，
  // equipment_instance 管"这一件是什么"；穿脱、校验、跨角色转移全在服务端单事务内完成

  /// <summary>
  /// 装备列表请求
  /// 类型：MessageID (枚举)
  /// 用途：拉取装备配置、本人实例与穿戴关系（消息体为空，身份由会话绑定）
  /// 对应数据结构：EquipmentListRequest
  /// 值：3501
  /// </summary>
  EquipmentListRequest = 3501;

  /// <summary>
  /// 装备列表响应
  /// 类型：MessageID (枚举)
  /// 用途：返回配置、实例（含穿戴者）与槽位快照
  /// 对应数据结构：EquipmentListResponse
  /// 值：3502
  /// </summary>
  EquipmentListResponse = 3502;

  /// <summary>
  /// 穿戴/卸下请求
  /// 类型：MessageID (枚举)
  /// 用途：把某个实例穿到角色槽位，instance_id=0 表示卸下该槽
  /// 对应数据结构：EquipRequest
  /// 值：3503
  /// </summary>
  EquipRequest = 3503;

  /// <summary>
  /// 穿戴/卸下响应
  /// 类型：MessageID (枚举)
  /// 用途：返回结果码、是否幂等命中与操作后的槽位/实例快照
  /// 对应数据结构：EquipResponse
  /// 值：3504
  /// </summary>
  EquipResponse = 3504;

  /// <summary>
  /// 新手引导进度拉取请求
  /// 类型：MessageID (枚举)
  /// 用途：进入主页时拉取「下一步该播哪一步」与完成标记
  /// 对应数据结构：GuidePullRequest
  /// 值：3601
  /// </summary>
  GuidePullRequest = 3601;

  /// <summary>
  /// 新手引导进度拉取响应
  /// 类型：MessageID (枚举)
  /// 用途：返回是否有记录、下一步下标与完成标记
  /// 对应数据结构：GuidePullResponse
  /// 值：3602
  /// </summary>
  GuidePullResponse = 3602;

  /// <summary>
  /// 新手引导进度上报请求
  /// 类型：MessageID (枚举)
  /// 用途：每推进一步或结束时覆盖式写入进度
  /// 对应数据结构：GuidePushRequest
  /// 值：3603
  /// </summary>
  GuidePushRequest = 3603;

  /// <summary>
  /// 新手引导进度上报响应
  /// 类型：MessageID (枚举)
  /// 用途：返回服务端落库后的步骤下标与完成标记
  /// 对应数据结构：GuidePushResponse
  /// 值：3604
  /// </summary>
  GuidePushResponse = 3604;
}
