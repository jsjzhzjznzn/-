// 语法版本：proto3
syntax = "proto3";

// 包名：客户端与服务端共享的消息体定义层
// 与 LoginPacket.proto / BagPacket.proto 等同属 common.network，消息名不冲突即可共存
package common.network;

// 引用背包协议的 BagSlotInfo/ItemConfigInfo（唤取响应附带背包快照与物品配置）
import "BagPacket.proto";

// 生成的 C# 命名空间（protoc 生成 ActivityPacket.cs 中类的归属）
option csharp_namespace = "Common.Network";

/// <summary>
/// 活动信息条目
/// 服务端按当前时间窗筛选后下发；客户端剩余时间 = end_at_ms - server_now_ms（用服务器时钟算，防本地时间偏差）
/// content_key/content_version 仅供展示与日志（热更包的真实版本由 YooAsset 版本文件管理，二者发布时同步 bump）
/// </summary>
message ActivityInfo {
  /// <summary>活动ID（activity_config.activity_id）</summary>
  int32 activity_id = 1;

  /// <summary>活动类型（枚举值：1 武器唤取；2 每日签到——决定客户端活动中心侧栏挂哪张内容页）</summary>
  int32 type = 2;

  /// <summary>关联卡池ID（banner_config.banner_id，唤取请求携带它）</summary>
  int32 banner_id = 3;

  /// <summary>内容包键（如 weapon_banner，供日志/展示）</summary>
  string content_key = 4;

  /// <summary>内容版本（与热更包版本对齐，如 1.0.0）</summary>
  string content_version = 5;

  /// <summary>活动标题（如 长刃唤取·苍鳞）</summary>
  string title = 6;

  /// <summary>活动副标题（如 5★长刃·终 概率大幅提升）</summary>
  string subtitle = 7;

  /// <summary>开始时间（Unix 毫秒）</summary>
  int64 start_at_ms = 8;

  /// <summary>结束时间（Unix 毫秒）</summary>
  int64 end_at_ms = 9;
}

/// <summary>
/// 活动列表请求
/// 打开活动入口时发送（身份由服务端会话绑定）
/// </summary>
message ActivityListRequest {
}

/// <summary>
/// 活动列表响应
/// 只返回当前时间窗内的活动；空列表 = 当前无活动
/// </summary>
message ActivityListResponse {
  /// <summary>是否成功</summary>
  bool success = 1;

  /// <summary>结果说明</summary>
  string message = 2;

  /// <summary>当前有效活动列表</summary>
  repeated ActivityInfo activities = 3;

  /// <summary>服务器当前时间（Unix 毫秒，客户端用它算剩余时间）</summary>
  int64 server_now_ms = 4;
}

/// <summary>
/// 唤取请求
/// 服务端权威：校验媒介持有→扣媒介→按卡池权重 roll→入包（满包转邮件）→写流水
/// </summary>
message GachaDrawRequest {
  /// <summary>卡池ID（来自 ActivityInfo.banner_id）</summary>
  int32 banner_id = 1;

  /// <summary>唤取次数（仅支持 1 单抽 / 10 十连）</summary>
  int32 count = 2;

  /// <summary>
  /// 幂等键（客户端生成，重试时必须复用同一个值）
  /// 服务端命中已结算记录时直接重放原结果、不再扣媒介/重抽；空值 = 不做幂等（老客户端兼容）
  /// </summary>
  string request_id = 3;
}

/// <summary>
/// 单个唤取结果条目
/// </summary>
message GachaResultItem {
  /// <summary>物品ID（对应 item_config.item_id）</summary>
  int32 item_id = 1;

  /// <summary>物品名（服务端补齐）</summary>
  string name = 2;

  /// <summary>稀有度（1-5，与背包口径一致，决定结果卡星色边框）</summary>
  int32 rarity = 3;

  /// <summary>图标资源键</summary>
  string icon_key = 4;

  /// <summary>是否为卡池 UP 物品（5★ 大图展示用）</summary>
  bool is_up = 5;

  /// <summary>是否由保底触发（pity_kind != 0 的兼容视图）</summary>
  bool is_pity = 6;

  /// <summary>是否为新获得（唤取前背包中没有该物品，且本次批次内首次出现）</summary>
  bool is_new = 7;

  /// <summary>
  /// 保底类型：0=无 1=5★计数保底 2=十连4★保底 3=大保底（歪过之后必出 UP）
  /// </summary>
  int32 pity_kind = 8;
}

/// <summary>
/// 唤取响应
/// 附带操作后的背包槽位快照与本次涉及物品的配置（客户端背包缓存直接刷新，无需二次拉取）
/// </summary>
message GachaDrawResponse {
  /// <summary>是否成功（失败=媒介不足/卡池不存在等，不扣任何东西）</summary>
  bool success = 1;

  /// <summary>结果说明</summary>
  string message = 2;

  /// <summary>唤取结果（按抽取顺序）</summary>
  repeated GachaResultItem results = 3;

  /// <summary>本次抽后 5★ 保底计数（距下次必出 5★ 还差 threshold - count 抽）</summary>
  int32 pity5_count = 4;

  /// <summary>5★ 保底阈值（如 30 = 30 抽内必出 5★）</summary>
  int32 pity5_threshold = 5;

  /// <summary>本卡池累计抽数</summary>
  int32 total_draws = 6;

  /// <summary>操作后的背包槽位快照（服务端权威，只含非空槽）</summary>
  repeated BagSlotInfo slots = 7;

  /// <summary>本次涉及物品的静态配置（客户端合并进运行时物品表）</summary>
  repeated ItemConfigInfo configs = 8;

  /// <summary>本次抽后，下一次 5★ 是否必定为 UP（大保底状态）</summary>
  int32 guaranteed_up = 9;

  /// <summary>是否为本 request_id 的原结果重放（true = 本次没有扣媒介、没有重新 roll）</summary>
  bool replayed = 10;
}

/// <summary>
/// 唤取流水请求
/// 打开唤取详单时发送（鸣潮"唤取记录"）
/// </summary>
message GachaHistoryRequest {
  /// <summary>卡池ID（0 = 全部卡池）</summary>
  int32 banner_id = 1;
}

/// <summary>
/// 单条唤取流水
/// </summary>
message GachaHistoryEntry {
  /// <summary>卡池ID</summary>
  int32 banner_id = 1;

  /// <summary>物品ID</summary>
  int32 item_id = 2;

  /// <summary>物品名</summary>
  string name = 3;

  /// <summary>稀有度</summary>
  int32 rarity = 4;

  /// <summary>图标资源键</summary>
  string icon_key = 5;

  /// <summary>是否保底触发</summary>
  bool is_pity = 6;

  /// <summary>抽取时间（Unix 毫秒）</summary>
  int64 created_at_ms = 7;

  /// <summary>保底类型：0=无 1=5★计数保底 2=十连4★保底 3=大保底</summary>
  int32 pity_kind = 8;
}

/// <summary>
/// 唤取流水响应
/// </summary>
message GachaHistoryResponse {
  /// <summary>是否成功</summary>
  bool success = 1;

  /// <summary>结果说明</summary>
  string message = 2;

  /// <summary>流水条目（按抽取时间倒序，最近优先）</summary>
  repeated GachaHistoryEntry entries = 3;

  /// <summary>当前卡池累计抽数（banner_id=0 时为全卡池合计）</summary>
  int32 total_draws = 4;

  /// <summary>当前卡池 5★ 保底计数（banner_id=0 时为 0）</summary>
  int32 pity5_count = 5;

  /// <summary>下一次 5★ 是否必定为 UP（大保底状态；banner_id=0 时为 false）</summary>
  bool guaranteed_up = 6;
}

/// <summary>
/// 活动切换推送
/// GM 轮换（2913）生效后服务端向所有在线会话广播当前活动状态（非请求的响应）
/// 客户端收到后刷新活动入口/面板；活动自然到期由客户端倒计时结束触发重拉，不走本推送
/// </summary>
message ActivityChangeNotify {
  /// <summary>切换后的当前有效活动列表</summary>
  repeated ActivityInfo activities = 1;

  /// <summary>服务器当前时间（Unix 毫秒）</summary>
  int64 server_now_ms = 2;
}

/// <summary>
/// GM 轮换活动请求
/// 联调/演示指令（与 2509 QuestGmSetProgress 同口径，不做鉴权，产品化时再收紧）：
/// target_activity_id = 0 → 结束当前活动、把下一排期活动提前到现在；
/// > 0 → 结束当前活动、把指定活动提前到现在
/// </summary>
message ActivityGmRotateRequest {
  /// <summary>目标活动ID（0 = 自动切到下一排期）</summary>
  int32 target_activity_id = 1;
}

/// <summary>
/// GM 轮换活动响应
/// 返回切换后的当前活动状态（调用方免二次拉取）
/// </summary>
message ActivityGmRotateResponse {
  /// <summary>是否成功</summary>
  bool success = 1;

  /// <summary>结果说明（切换了什么）</summary>
  string message = 2;

  /// <summary>切换后的当前有效活动</summary>
  repeated ActivityInfo activities = 3;

  /// <summary>服务器当前时间（Unix 毫秒）</summary>
  int64 server_now_ms = 4;
}

/// <summary>
/// 单日签到奖励条目
/// 服务端把 sign_config 的第 N 天奖励与玩家已签状态合成下发；claimed = 该天奖励已领
/// </summary>
message SignInDayInfo {
  /// <summary>天次（1 起始）</summary>
  int32 day = 1;

  /// <summary>物品ID（item_config.item_id）</summary>
  int32 item_id = 2;

  /// <summary>物品名（服务端补齐）</summary>
  string name = 3;

  /// <summary>图标资源键</summary>
  string icon_key = 4;

  /// <summary>稀有度（1-5，与背包口径一致）</summary>
  int32 rarity = 5;

  /// <summary>数量</summary>
  int32 count = 6;

  /// <summary>该天是否已签（day ≤ signed_days 时为 true）</summary>
  bool claimed = 7;
}

/// <summary>
/// 签到状态请求
/// 打开签到页时发送；sign_id = 签到活动的 activity_id（ActivityInfo.type = 2）
/// </summary>
message SignInListRequest {
  /// <summary>签到活动ID</summary>
  int32 sign_id = 1;
}

/// <summary>
/// 签到状态响应
/// 返回完整 7 天奖励表与玩家签到进度（客户端据此渲染格子与按钮态）
/// </summary>
message SignInListResponse {
  /// <summary>是否成功</summary>
  bool success = 1;

  /// <summary>结果说明</summary>
  string message = 2;

  /// <summary>签到活动ID</summary>
  int32 sign_id = 3;

  /// <summary>总天数（sign_config 配置数，如 7）</summary>
  int32 total_days = 4;

  /// <summary>已签天数（累计次数口径，断签不回退）</summary>
  int32 signed_days = 5;

  /// <summary>今天是否已签（自然日按服务器本地时区；E2E 可用环境变量 CS_SIGN_TODAY 覆盖）</summary>
  bool today_signed = 6;

  /// <summary>服务器当前时间（Unix 毫秒）</summary>
  int64 server_now_ms = 7;

  /// <summary>按天次升序的奖励与状态快照</summary>
  repeated SignInDayInfo days = 8;
}

/// <summary>
/// 签到请求
/// 只带 sign_id，签第几天由服务端按 signed_days+1 裁决（每天限一次）
/// </summary>
message SignInClaimRequest {
  /// <summary>签到活动ID</summary>
  int32 sign_id = 1;
}

/// <summary>
/// 签到响应
/// 回执带完整签到状态快照 + 操作后的背包快照与物品配置（客户端免二次拉取，与 GachaDrawResponse 同模式）
/// </summary>
message SignInClaimResponse {
  /// <summary>是否成功（失败=今日已签/活动不在窗口/已完成全部天数等，不发放任何东西）</summary>
  bool success = 1;

  /// <summary>结果说明（成功时含获得物品说明；满包转邮件在 message 说明）</summary>
  string message = 2;

  /// <summary>签到活动ID</summary>
  int32 sign_id = 3;

  /// <summary>本次签到的天次（失败为 0）</summary>
  int32 day = 4;

  /// <summary>总天数</summary>
  int32 total_days = 5;

  /// <summary>已签天数</summary>
  int32 signed_days = 6;

  /// <summary>今天是否已签</summary>
  bool today_signed = 7;

  /// <summary>签到后的完整天次快照</summary>
  repeated SignInDayInfo days = 8;

  /// <summary>操作后的背包槽位快照（服务端权威，只含非空槽）</summary>
  repeated BagSlotInfo slots = 9;

  /// <summary>本次涉及物品的静态配置（客户端合并进运行时物品表）</summary>
  repeated ItemConfigInfo configs = 10;
}
